#
# deny.toml — cargo-deny configuration for pg_bolt.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "PostgreSQL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    # craton-bolt is licensed under AGPL-3.0-only.
    "AGPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[advisories]
version = 2
unmaintained = "all"
yanked = "warn"
ignore = [
    # Transitive dependencies of arrow/parquet 53.4.1 (no non-breaking upgrade available):
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2026-0391", # zstd (with_context stream reuse)
    "RUSTSEC-2026-0403", # zstd-safe (legacy frame decompression)
    "RUSTSEC-2026-0410", # zstd-sys (wasm32 allocator shim only)
    "RUSTSEC-2026-0435", # thrift 0.17.0 (pinned by parquet 53.4.1)
    "RUSTSEC-2026-0543", # chrono (unmaintained, via arrow 53.4.1)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
