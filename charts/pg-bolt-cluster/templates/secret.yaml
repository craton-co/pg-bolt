{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg-bolt-cluster.secretName" . }}
  labels:
    {{- include "pg-bolt-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ default "postgres" .Values.auth.postgresPassword | b64enc | quote }}
{{- end }}
