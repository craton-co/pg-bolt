# SPDX-License-Identifier: Apache-2.0

name: Docker Images (GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pg_versions:
        description: "Comma-separated PG versions (or 'all')"
        required: false
        default: "all"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push pg${{ matrix.pg }}-gpu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]

    steps:
      - name: Checkout pg_bolt
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pg${{ matrix.pg }}-gpu
            type=semver,pattern={{version}},prefix=pg${{ matrix.pg }}-gpu-
            type=raw,value=latest,enable=${{ matrix.pg == 17 }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          push: true
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=docker-pg${{ matrix.pg }}
